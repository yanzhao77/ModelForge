name: ModelForge GPU Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  cuda-smoke:
    # Configure a self-hosted runner carrying all labels before enabling this workflow.
    runs-on: [self-hosted, linux, nvidia-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify runner hardware
        run: nvidia-smi
      - name: Install GPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-ai.txt
      - name: Execute CUDA smoke
        run: pytest tests/test_hardware_gpu.py -q -m gpu
