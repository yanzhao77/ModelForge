name: ModelForge CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-gui.txt
      - name: Verify whitespace and lint
        run: |
          git diff --check
          ruff check backend client tests scripts
      - name: Import and lifecycle smoke
        env:
          PYTHONPATH: backend/app
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c 'import main; assert main.app is not None'
          pytest -q tests/test_app_boot.py
      - name: Run full test suite with coverage threshold
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q --cov=backend/app --cov-fail-under=75 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Security dependency audit (runtime)
        run: |
          mkdir -p release-artifacts
          pip-audit -r requirements.txt --format json --output release-artifacts/pip-audit-runtime.json
      - name: Security dependency audit (development)
        run: pip-audit -r requirements-dev.txt --format json --output release-artifacts/pip-audit-dev.json
      - name: Generate development inventory SBOM (full venv)
        run: python scripts/generate_sbom.py --mode=installed --source-label="development-venv (requirements.txt + requirements-dev.txt + requirements-gui.txt)" --output release-artifacts/sbom-dev.cdx.json
      - name: Generate runtime SBOM (isolated runtime venv)
        run: |
          python -m venv .venv-runtime
          .venv-runtime/bin/pip install --upgrade pip
          .venv-runtime/bin/pip install -r requirements.txt
          .venv-runtime/bin/python scripts/generate_sbom.py --mode=installed --source-label="isolated-runtime-venv (requirements.txt only)" --output release-artifacts/sbom-runtime.cdx.json
          echo "Runtime SBOM source: isolated runtime venv (requirements.txt only)"
      - name: Record candidate metadata
        run: |
          mkdir -p release-artifacts
          SHA=$(git rev-parse HEAD)
          PYTHON_VER=$(python --version | cut -d' ' -f2)
          PIP_VER=$(pip --version | cut -d' ' -f2)
          RUFF_VER=$(ruff --version | cut -d' ' -f2)
          PYTEST_VER=$(python -m pytest --version | cut -d' ' -f2)
          cat > release-artifacts/candidate-metadata.json <<EOF
          {
            "candidate_sha": "$SHA",
            "python_version": "$PYTHON_VER",
            "pip_version": "$PIP_VER",
            "ruff_version": "$RUFF_VER",
            "pytest_version": "$PYTEST_VER",
            "coverage_threshold": 75,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      - name: Upload runtime SBOM (authoritative)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-runtime-cdx
          path: release-artifacts/sbom-runtime.cdx.json
          if-no-files-found: error
      - name: Upload development inventory SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dev-cdx
          path: release-artifacts/sbom-dev.cdx.json
          if-no-files-found: error
      - name: Upload runtime pip-audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-runtime
          path: release-artifacts/pip-audit-runtime.json
          if-no-files-found: error
      - name: Upload development pip-audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-dev
          path: release-artifacts/pip-audit-dev.json
          if-no-files-found: error
      - name: Upload candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: candidate-metadata
          path: release-artifacts/candidate-metadata.json
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install desktop test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-gui.txt
      - name: Lint desktop client
        run: ruff check client/pyside6
      - name: Run desktop readiness and onboarding tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q \
            tests/test_model_readiness_service.py \
            tests/test_model_readiness_api.py \
            tests/test_desktop_resilience.py \
            tests/test_workspace_task_center_smoke.py \
            tests/test_i18n_runtime.py \
            --cov=client/pyside6 --cov-report=xml:desktop-coverage.xml
      - name: Upload desktop coverage report
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage-xml
          path: desktop-coverage.xml
          if-no-files-found: error

  build:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t modelforge:ci .
      - name: Start container and verify healthz
        run: |
          set -e
          CONTAINER="modelforge-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$CONTAINER" -p 8000:8000             -e JWT_SECRET="ci-only-jwt-secret-that-is-at-least-thirty-two-characters"                        -e CORS_ALLOW_ORIGINS="https://console.example.test"             modelforge:ci
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 5
          done
          exit 1

  # ---------------------------------------------------------------------------
  # Release Candidate: Docker + PostgreSQL/Alembic end-to-end validation
  # ---------------------------------------------------------------------------
  release-candidate:
    needs: [test, desktop, build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modelforge
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: modelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://modelforge:ci-test-password@localhost:5432/modelforge_test
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-thirty-two-characters
      POSTGRES_PASSWORD: ci-test-password
      MODELFORGE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt psycopg2-binary
      - name: Build Docker image and record digest
        run: |
          docker build -t modelforge:rc-${{ github.sha }} .
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' modelforge:rc-${{ github.sha }} 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker inspect --format='{{.Id}}' modelforge:rc-${{ github.sha }})
          fi
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Image digest: $DIGEST"
      - name: Generate authoritative runtime SBOM from final Docker image
        run: |
          mkdir -p release-artifacts
          docker run --rm \
            --user root \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/release-artifacts:/out" \
            --entrypoint python \
            modelforge:rc-${{ github.sha }} \
            /scripts/generate_sbom.py --mode=installed --source-label="docker-image:modelforge:rc-${{ github.sha }}" --output /out/sbom-image.cdx.json
          echo "Runtime SBOM source: final Docker image modelforge:rc-${{ github.sha }}"
      - name: Verify non-root user in image
        run: |
          USER=$(docker run --rm modelforge:rc-${{ github.sha }} whoami)
          echo "Container user: $USER"
          test "$USER" = "modelforge" || (echo "FAIL: not running as modelforge" && exit 1)
      - name: Alembic upgrade head on empty database
        run: |
          alembic upgrade head
          echo "Upgrade head succeeded"
      - name: Alembic current and history
        run: |
          alembic current
          alembic history --verbose
      - name: Alembic upgrade head (idempotency check)
        run: |
          alembic upgrade head
          echo "Idempotent upgrade succeeded"
      - name: Start application and verify /healthz
        run: |
          set -e
          CONTAINER="modelforge-rc-${{ github.run_id }}"
          CONTAINER_DB_URL=$(echo "$DATABASE_URL" | sed 's|localhost|host.docker.internal|')
          docker run -d --name "$CONTAINER" -p 8000:8000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL="$CONTAINER_DB_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e MODELFORGE_ENV="$MODELFORGE_ENV" \
            -e CORS_ALLOW_ORIGINS="https://console.example.test" \
            modelforge:rc-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 5
          done
          echo "FAIL: /healthz not reachable after 150s"
          docker logs "$CONTAINER" || true
          exit 1
      - name: Verify API smoke (register, login, /auth/me)
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"rc-test","email":"rc@test.test","password":"Test1234!"}' || true
          LOGIN_RESP=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"rc-test","password":"Test1234!"}')
          echo "Login response: $LOGIN_RESP"
          TOKEN=$(echo "$LOGIN_RESP" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('token') or d.get('access_token',''))")
          test -n "$TOKEN" || (echo "FAIL: no token in $LOGIN_RESP" && exit 1)
          curl -fsS http://127.0.0.1:8000/api/v1/auth/me \
            -H "Authorization: Bearer $TOKEN"
          echo ""
          echo "Auth smoke passed"
      - name: Verify alembic_version is at head
        run: |
          cd backend
          VERSION=$(python -c "from sqlalchemy import create_engine, text; e=create_engine('$DATABASE_URL'); print(e.connect().execute(text('SELECT version_num FROM alembic_version')).scalar())")
          echo "alembic_version: $VERSION"
          test -n "$VERSION" || (echo "FAIL: no alembic_version" && exit 1)
      - name: Verify logs contain no secrets
        run: |
          docker logs modelforge-rc-${{ github.run_id }} > /tmp/container-logs.txt 2>&1 || true
          if grep -q "$JWT_SECRET" /tmp/container-logs.txt; then
            echo "FAIL: JWT_SECRET found in container logs"
            exit 1
          fi
          if grep -q "$POSTGRES_PASSWORD" /tmp/container-logs.txt; then
            echo "FAIL: POSTGRES_PASSWORD found in container logs"
            exit 1
          fi
          echo "No secrets in container logs"
      - name: SIGTERM graceful shutdown
        run: |
          docker stop --time=10 modelforge-rc-${{ github.run_id }}
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' modelforge-rc-${{ github.run_id }})
          echo "Exit code after SIGTERM: $EXIT_CODE"
          # 0 or 137 (SIGTERM) are acceptable
          test "$EXIT_CODE" = "0" -o "$EXIT_CODE" = "137" || (echo "FAIL: unexpected exit code" && exit 1)
      - name: Cleanup containers and volumes
        if: always()
        run: |
          docker rm -f modelforge-rc-${{ github.run_id }} 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence
          path: release-artifacts/
          if-no-files-found: warn
