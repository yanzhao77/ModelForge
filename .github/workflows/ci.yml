name: ModelForge CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-gui.txt
      - name: Verify whitespace and lint
        run: |
          git diff --check
          ruff check backend/app client/pyside6 tests
      - name: Import and lifecycle smoke
        env:
          PYTHONPATH: backend/app
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c 'import main; assert main.app is not None'
          pytest -q tests/test_app_boot.py
      - name: Run full test suite with coverage threshold
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q --cov=backend/app --cov-fail-under=30 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Security dependency audit
        run: pip-audit -r requirements.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install desktop test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-gui.txt
      - name: Lint desktop client
        run: ruff check client/pyside6
      - name: Run desktop readiness and onboarding tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q \
            tests/test_model_readiness_service.py \
            tests/test_model_readiness_api.py \
            tests/test_desktop_resilience.py \
            tests/test_workspace_task_center_smoke.py \
            tests/test_i18n_runtime.py \
            --cov=client/pyside6 --cov-report=xml:desktop-coverage.xml
      - name: Upload desktop coverage report
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage-xml
          path: desktop-coverage.xml
          if-no-files-found: error

  build:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t modelforge:ci .
      - name: Start container and verify healthz
        run: |
          set -e
          CONTAINER="modelforge-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$CONTAINER" -p 8000:8000             -e JWT_SECRET="ci-only-jwt-secret-that-is-at-least-thirty-two-characters"                        -e CORS_ALLOW_ORIGINS="https://console.example.test"             modelforge:ci
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 5
          done
          exit 1
