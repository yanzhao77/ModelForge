name: ModelForge CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check backend/app client/pyside6 --ignore E501,F401 --exit-zero || true

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t modelforge:ci .

      - name: Start container and verify healthz
        run: |
          set -e
          # unique container name per run to avoid collisions on retries
          CONTAINER="modelforge-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$CONTAINER" -p 8000:8000 modelforge:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/tmp/health.out 2>/dev/null; then
              echo "healthz OK after ${i} attempts: $(cat /tmp/health.out)"
              ok=1
              break
            fi
            echo "waiting for healthz (attempt ${i}/30)...";
            sleep 5
          done
          # always capture logs and clean up, regardless of success
          docker logs "$CONTAINER" >/tmp/container.log 2>&1 || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            echo "=== container logs ==="
            cat /tmp/container.log
            echo "::error::healthz check FAILED after 30 attempts"
            exit 1
          fi