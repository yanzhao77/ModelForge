name: ModelForge CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-gui.txt
      - name: Lint (ruff)
        run: ruff check backend/app client/pyside6 --ignore E501,F401
      - name: Security dependency audit
        run: pip-audit -r requirements.txt
      - name: Run full test suite with coverage
        run: |
          pytest tests/ -q --cov=backend/app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t modelforge:ci .
      - name: Start container and verify healthz
        run: |
          set -e
          CONTAINER="modelforge-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$CONTAINER" -p 8000:8000             -e JWT_SECRET="ci-only-jwt-secret-that-is-at-least-thirty-two-characters"             modelforge:ci
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 5
          done
          exit 1
