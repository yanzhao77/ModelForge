# ModelForge 2.0 Configuration
model_path: ./models
database_path: ./data/modelforge.db
log_level: INFO
jwt_secret: ""  # Supply JWT_SECRET from the environment in production
jwt_expire_minutes: 10080
ollama_base_url: "http://localhost:11434"
enable_streaming: true
hf_endpoint: "https://hf-mirror.com"
model_dir: ./models
data_dir: ./data
max_upload_size: 104857600
max_dataset_size: 209715200
dataset_dir: ./data/datasets
train_output_dir: ./outputs
train_max_workers: 1
kb_persist: true

# ===== ModelForge 3.0 Agent Runtime =====
runtime:
  max_iterations: 20
  max_tool_calls: 50
  timeout_seconds: 600
  event_persistence: true
  event_retention_days: 30
tools:
  default_timeout_seconds: 60
  command_execution_enabled: false
runtime_admin_usernames: ""  # Configure with RUNTIME_ADMIN_USERNAMES
cors_allow_origins: "http://localhost:3000,http://localhost:5173"
policy:
  default_network_access: false
  default_shell_access: false
  default_filesystem_access: true
