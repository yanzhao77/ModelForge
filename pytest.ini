[pytest]
markers =
    gpu: requires a self-hosted NVIDIA CUDA runner
    network: requires explicitly enabled external network access
    real_model: requires optional AI dependencies and a real model artifact
    desktop: requires a PySide6/Qt runtime (offscreen); selected by the CI desktop job
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
